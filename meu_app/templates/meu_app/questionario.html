{% extends 'meu_app/base.html' %}
{% load static %}
{% block title %}Bzu Tech | Questionário{% endblock %}
{% block css %}<link rel="stylesheet" href="{% static 'meu_app/css/questionario.css' %}?v=5">{% endblock %}

{% block content %}
<section class="pergunta glass" id="pergunta" aria-labelledby="titulo-pergunta">
  <div class="etapa">
    <span id="bloco-pergunta"></span>
    <span id="numero-pergunta"></span>
  </div>
  <div class="progresso" aria-hidden="true"><span id="barra-progresso"></span></div>
  <h1 id="titulo-pergunta" tabindex="-1"></h1>
  <p class="instrucao" id="instrucao-pergunta"></p>
  <div id="corpo-pergunta"></div>
  <noscript><p>Ative o JavaScript para responder o questionário.</p></noscript>
</section>

<p class="erro-envio" id="erro-envio" role="alert" hidden></p>
<div class="navegacao">
  {% csrf_token %}
  <button class="btn btn-outline" id="pergunta-anterior" type="button" data-url="{% url 'home' %}">&lt; Anterior</button>
  <button class="btn btn-outline" id="proxima-pergunta" type="button" data-url="{% url 'configurar' %}" data-api="{% url 'api_questionario' %}" disabled>Próxima &gt;</button>
</div>
{% endblock %}

{% block js %}<script src="{% static 'meu_app/js/questionario.js' %}?v=5"></script>{% endblock %}
